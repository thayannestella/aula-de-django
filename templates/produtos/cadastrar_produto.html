{% extends 'base.html' %}
{% block title %}Cadastro de Produtos{% endblock %}

{% block content %}
    <h1>Cadastrar Novo Produto</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p}}

        <button type="submit">Salvar</button>
    </form>

    <br>

    <a href="{% url 'listar_produtos' %}">Voltar para a lista de produtos</a>
{% endblock %}
